services:
  db:
    image: verdure-db
    build:
      context: ./DB
      dockerfile: Dockerfile
    container_name: verdure-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: verdure-backend
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: verdure-backend
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PREDICTOR_URL: http://ai_chatbot:5000/chat
    ports:
      - "3030:3030"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ai_chatbot:
    image: verdure-ai-chatbot
    build:
      context: ./AI-Chatbot
      dockerfile: Dockerfile
    container_name: verdure-ai-chatbot
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PREDICTOR_PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: verdure-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: verdure-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
