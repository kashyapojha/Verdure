apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot
  namespace: verdure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-chatbot
  template:
    metadata:
      labels:
        app: ai-chatbot
    spec:
      containers:
        - name: ai-chatbot
          image: karann24/verdure-ai-chatbot:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: verdure-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdure-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: verdure-secrets
                  key: DB_NAME
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 45   # BERT model load takes time
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              memory: "256Mi"     # BERT needs more memory than typical services
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-chatbot-service
  namespace: verdure
spec:
  selector:
    app: ai-chatbot
  ports:
    - port: 5000
      targetPort: 5000