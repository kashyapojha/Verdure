apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: verdure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: karann24/verdure-backend:latest
          ports:
            - containerPort: 3030
          envFrom:
            - configMapRef:
                name: verdure-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdure-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: verdure-secrets
                  key: DB_NAME
          livenessProbe:
            httpGet:
              path: /health
              port: 3030
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3030
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: verdure
spec:
  selector:
    app: backend
  ports:
    - port: 3030
      targetPort: 3030