apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdure-ai-chatbot
  namespace: verdure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verdure-ai-chatbot
  template:
    metadata:
      labels:
        app: verdure-ai-chatbot
    spec:
      containers:
        - name: ai-chatbot
          image: karann24/verdure-ai-chatbot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: verdure-db
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verdure-db-secret
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: verdure-db-secret
                  key: db-name
            - name: PREDICTOR_PORT
              value: "5000"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
