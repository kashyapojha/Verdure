name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "20"
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  # =====================================
  # Build and Test
  # =====================================
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: verdure_test

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------
      # Setup Node
      # ---------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---------------------------------
      # Backend Dependencies
      # ---------------------------------
      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      # ---------------------------------
      # Frontend Dependencies
      # ---------------------------------
      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      # ---------------------------------
      # Setup Python
      # ---------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------
      # AI Chatbot Dependencies
      # ---------------------------------
      - name: Install AI-Chatbot Dependencies
        run: |
          cd AI-Chatbot
          pip install -r requirements.txt

      # ---------------------------------
      # Build Frontend
      # ---------------------------------
      - name: Install Frontend Dependencies 
        run: | 
          cd Frontend 
          npm ci

      # ---------------------------------
      # Verify Backend
      # ---------------------------------
      - name: Verify Backend
        run: |
          cd Backend
          echo "Backend build successful"

      # ---------------------------------
      # Verify AI Chatbot
      # ---------------------------------
      - name: Verify AI Chatbot
        run: |
          cd AI-Chatbot
          echo "AI Chatbot build successful"

  # =====================================
  # Docker Build and Push
  # =====================================
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    if: |
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop') &&
      github.event_name != 'pull_request'
    
    environment: docker

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------
      # Setup Docker Buildx
      # ---------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------
      # Login to Docker Hub
      # ---------------------------------
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # ---------------------------------
      # Build Docker Images
      # ---------------------------------
      - name: Build Docker Images
        run: docker compose build

      # ---------------------------------
      # Tag Docker Images
      # ---------------------------------
      - name: Tag Docker Images
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker tag verdure-frontend \
          ${{ env.DOCKERHUB_USERNAME }}/verdure-frontend:latest

          docker tag verdure-backend \
          ${{ env.DOCKERHUB_USERNAME }}/verdure-backend:latest

          docker tag verdure-ai-chatbot \
          ${{ env.DOCKERHUB_USERNAME }}/verdure-ai-chatbot:latest

      # ---------------------------------
      # Push Docker Images
      # ---------------------------------
      - name: Push Docker Images
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/verdure-frontend:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/verdure-backend:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/verdure-ai-chatbot:latest

      # ---------------------------------
      # Warning if Secrets Missing
      # ---------------------------------
      - name: Docker Hub Secrets Not Configured
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: |
          echo "⚠️  Docker Hub secrets are not configured!"
          echo "Please add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to your repository secrets."
          echo "Go to: Settings → Secrets and variables → Actions"


      # ---------------------------------
      # Logout from Docker Hub
      # ---------------------------------
      - name: Logout from Docker Hub
        if: always()
        uses: docker/login-action@v3
        with:
          logout: true
