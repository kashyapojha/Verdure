name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Code Quality and Security
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: |
          cd Backend
          npm ci

      - name: Run security audit
        run: |
          cd Backend
          npm audit --audit-level=moderate

  # Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    needs: lint-and-security
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: verdure_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd Backend
          npm ci

      - name: Create test environment file
        run: |
          cd Backend
          cat > .env.test << EOF
          DB_HOST=localhost
          DB_USER=root
          DB_PASSWORD=testpassword
          DB_NAME=verdure_test
          DB_PORT=3306
          PORT=3030
          NODE_ENV=test
          EOF

      - name: Wait for MySQL
        run: |
          timeout 60 bash -c 'until mysql -h localhost -u root -ptestpassword -e "SELECT 1"; do sleep 2; done'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AI-Chatbot dependencies
        run: |
          cd AI-Chatbot
          pip install -r requirements.txt

      - name: Run AI-Chatbot tests (if available)
        run: |
          cd AI-Chatbot
          if [ -f "test_model.py" ]; then
            python test_model.py
          else
            echo "No AI-Chatbot tests found, skipping"
          fi

      - name: Build application
        run: |
          echo "Building application..."
          echo "Backend dependencies installed successfully"
          echo "Frontend files are static HTML/CSS/JS"

  # Docker Build and Push
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          # Build all services
          docker compose build
          
          # Tag images for registry
          docker tag verdure-db ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-db:latest
          docker tag verdure-backend ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          docker tag verdure-ai-chatbot ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-ai-chatbot:latest
          docker tag verdure-frontend ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          
          # Push images
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-db:latest
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-ai-chatbot:latest
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            echo "🚀 Deploying to production..."
            
            # Navigate to project directory
            cd /var/www/verdure
            
            # Pull latest code
            git pull origin main
            
            # Pull new images
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-db:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-ai-chatbot:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            
            # Stop and remove existing containers
            docker compose down || true
            
            # Start services (will use pulled images since compose has build, but images exist)
            docker compose up -d --no-build
            
            # Clean up old images
            docker image prune -f
            
            echo "✅ Production deployment completed!"

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          script: |
            echo "🚀 Deploying to staging..."
            
            # Navigate to project directory
            cd /var/www/verdure-staging
            
            # Pull latest code
            git pull origin develop
            
            # Pull new images
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-db:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-ai-chatbot:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            
            # Stop and remove existing containers
            docker compose down || true
            
            # Start services
            docker compose up -d --no-build
            
            # Clean up old images
            docker image prune -f
            
            echo "✅ Staging deployment completed!"

  # Health Check
  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always() && (needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success')
    
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check production health
        if: needs.deploy-production.result == 'success'
        run: |
          echo "Checking production health..."
          curl -f ${{ secrets.PROD_BACKEND_URL }}/health || echo "Backend health check failed"
          curl -f ${{ secrets.PROD_AI_URL }}/health || echo "AI health check failed"
          curl -f ${{ secrets.PROD_FRONTEND_URL }} || echo "Frontend health check failed"

      - name: Check staging health
        if: needs.deploy-staging.result == 'success'
        run: |
          echo "Checking staging health..."
          curl -f ${{ secrets.STAGING_BACKEND_URL }}/health || echo "Backend health check failed"
          curl -f ${{ secrets.STAGING_AI_URL }}/health || echo "AI health check failed"
          curl -f ${{ secrets.STAGING_FRONTEND_URL }} || echo "Frontend health check failed"

  # Notification
  notify:
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.health-check.result == 'success'
        run: |
          echo "✅ CI/CD Pipeline completed successfully!"
          echo "Deployment: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Notify on failure
        if: needs.health-check.result == 'failure'
        run: |
          echo "❌ CI/CD Pipeline failed!"
          echo "Deployment: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          exit 1
