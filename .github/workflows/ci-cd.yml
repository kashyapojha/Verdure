name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "20"
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  # =====================================
  # Build and Test
  # =====================================
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: verdure_test

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------
      # Setup Node
      # ---------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---------------------------------
      # Install Backend Dependencies
      # ---------------------------------
      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      # ---------------------------------
      # Verify Backend Syntax
      # ---------------------------------
      - name: Verify Backend Syntax
        run: |
          cd Backend
          npm test

      # ---------------------------------
      # Validate Frontend Static Site
      # ---------------------------------
      - name: Validate Frontend Static Site
        run: |
          test -f Frontend/index.html
          test -d Frontend/js
          echo "Frontend static assets are present"

      # ---------------------------------
      # Setup Python
      # ---------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------
      # AI Chatbot Dependencies
      # ---------------------------------
      - name: Install AI-Chatbot Dependencies
        run: |
          cd AI-Chatbot
          pip install -r requirements.txt

      # ---------------------------------
      # Verify AI Chatbot Python Sources
      # ---------------------------------
      - name: Verify AI Chatbot Python Sources
        run: |
          python -m py_compile AI-Chatbot/app.py AI-Chatbot/train_and_evaluate.py AI-Chatbot/test_model.py

      
      # ---------------------------------
      # Validate Docker Compose
      # ---------------------------------
      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config


  # =====================================
  # MLOps Training and Evaluation
  # =====================================
  mlops-train:
    runs-on: ubuntu-latest
    needs: build-and-test

    if: |
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop') &&
      github.event_name != 'pull_request'

    environment: mlops

    outputs:
      run_mlops: ${{ steps.check.outputs.run_mlops }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI-Chatbot Dependencies
        run: |
          cd AI-Chatbot
          pip install -r requirements.txt

      - name: Determine whether to run MLOps training
        id: check
        run: |
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || [ -z "$before" ]; then
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$sha")
          else
            changed_files=$(git diff --name-only "$before" "$sha")
          fi
          echo "Changed files: $changed_files"
          should_run=false
          if echo "$changed_files" | grep -Eq '^AI-Chatbot/final_data.csv$'; then
            should_run=true
          fi
          echo "run_mlops=$should_run" >> "$GITHUB_OUTPUT"

      - name: Train and Evaluate AI Chatbot
        if: steps.check.outputs.run_mlops == 'true'
        run: |
          cd AI-Chatbot
          python train_and_evaluate.py \
            --data-path final_data.csv \
            --model-dir bert_model \
            --tokenizer-dir bert_tokenizer \
            --label-encoder-path label_encoder.pkl \
            --epochs 3 \
            --batch-size 16 \
            --max-len 128 \
            --min-accuracy 0.5

      - name: Upload trained model artifacts
        if: steps.check.outputs.run_mlops == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-chatbot-model
          path: |
            AI-Chatbot/bert_model
            AI-Chatbot/bert_tokenizer
            AI-Chatbot/label_encoder.pkl
            AI-Chatbot/metrics.json

      - name: Skip MLOps training
        if: steps.check.outputs.run_mlops != 'true'
        run: |
          echo "No relevant AI-Chatbot data changes detected. Skipping MLOps training."

  # =====================================
  # Docker Build and Push
  # =====================================
  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, mlops-train]

    if: |
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop') &&
      github.event_name != 'pull_request'
    
    environment: docker

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model artifact
        if: needs.mlops-train.outputs.run_mlops == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ai-chatbot-model
          path: .

      - name: Verify downloaded AI-Chatbot model artifacts
        if: needs.mlops-train.outputs.run_mlops == 'true'
        run: |
          echo "Downloaded AI-Chatbot artifacts:"
          find AI-Chatbot -maxdepth 2 -type f | sort

      - name: Ensure repo AI-Chatbot model assets exist
        if: needs.mlops-train.outputs.run_mlops != 'true'
        run: |
          test -d AI-Chatbot/bert_model
          test -d AI-Chatbot/bert_tokenizer
          test -f AI-Chatbot/label_encoder.pkl
          echo "AI-Chatbot model assets are present in the repo."

      # ---------------------------------
      # Setup Docker Buildx
      # ---------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------
      # Login to Docker Hub
      # ---------------------------------
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # ---------------------------------
      # Build Docker Images
      # ---------------------------------
      - name: Build Docker Images
        run: docker compose build

      # ---------------------------------
      # Tag Docker Images
      # ---------------------------------
      - name: Tag Docker Images
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker tag verdure-db \
          ${{ env.DOCKERHUB_USERNAME }}/verdure-db:latest

          docker tag verdure-frontend \
          ${{ env.DOCKERHUB_USERNAME }}/verdure-frontend:latest

          docker tag verdure-backend \
          ${{ env.DOCKERHUB_USERNAME }}/verdure-backend:latest

          docker tag verdure-ai-chatbot \
          ${{ env.DOCKERHUB_USERNAME }}/verdure-ai-chatbot:latest

      # ---------------------------------
      # Push Docker Images
      # ---------------------------------
      - name: Push Docker Images
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/verdure-db:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/verdure-frontend:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/verdure-backend:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/verdure-ai-chatbot:latest
           
  # =====================================
  # Deploy to AWS EC2
  # =====================================
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.9
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DB_NAME,DB_PASSWORD
          script: |
            set -e

            echo "🚀 Starting Verdure deployment..."

            cd /home/ec2-user/Verdure

            echo "📥 Syncing latest code"
            git fetch origin
            git reset --hard origin/main

            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "🔑 Logging in to Docker Hub on remote server..."
              echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            fi

            echo "🐳 Pulling latest Docker images..."
            docker pull $DOCKERHUB_USERNAME/verdure-db:latest
            docker pull $DOCKERHUB_USERNAME/verdure-frontend:latest
            docker pull $DOCKERHUB_USERNAME/verdure-backend:latest
            docker pull $DOCKERHUB_USERNAME/verdure-ai-chatbot:latest

            echo "🏷️ Tagging Docker images locally..."
            docker tag $DOCKERHUB_USERNAME/verdure-db:latest verdure-db:latest
            docker tag $DOCKERHUB_USERNAME/verdure-frontend:latest verdure-frontend:latest
            docker tag $DOCKERHUB_USERNAME/verdure-backend:latest verdure-backend:latest
            docker tag $DOCKERHUB_USERNAME/verdure-ai-chatbot:latest verdure-ai-chatbot:latest

            echo "🛑 Stopping old containers"
            docker compose down

            echo "▶️ Starting updated containers"
            docker compose up -d --remove-orphans

            echo "🧹 Cleaning unused Docker images"
            docker image prune -f

            echo "✅ Verdure deployment completed successfully!"
 