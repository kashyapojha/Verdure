name: Backend CI/CD

on:
  push:
    branches: ["main"] # Change if your branch is different
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code from the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (match your VM's version)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"

      # 3️⃣ Install dependencies locally (optional)
      - name: Install dependencies
        run: npm install

      # 6️⃣ Deploy to Azure VM via SSH
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/verdure

            # Fix safe directory issue
            git config --global --add safe.directory /var/www/verdure

            # Pull latest changes
            git pull origin main

            # Ensure correct permissions
            sudo chown -R $USER:$USER /var/www/verdure
            sudo chmod -R 755 /var/www/verdure

            # Install dependencies without dev packages
            npm install --production --unsafe-perm

            # Restart or start PM2 process
            if pm2 list | grep -q verdure; then
              pm2 restart verdure
            else
              pm2 start npm --name verdure -- start
            fi

            pm2 save
