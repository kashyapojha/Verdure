name: Backend CI/CD

on:
  push:
    branches: ["main"] # Change if your branch is different
  pull_request:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code from the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (match your VM's version)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Run tests (optional — remove if not needed)
      # - name: Run tests
      #   run: npm test

      # 5️⃣ Build (optional — remove if not needed)
      # - name: Build project
      #   run: npm run build

      # 6️⃣ Deploy to Azure VM via SSH
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/verdure   # <-- Change to your backend folder path on VM
            git pull origin main
            npm install --production
            pm2 restart all
