name: Test SSH from GitHub

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "✅ GitHub Actions connected to VM!"
            hostname
            whoami

            echo "🔍 Checking Verdure project directory..."
            cd /var/www/verdure

            echo "🛠 Fixing Git safe directory..."
            git config --global --add safe.directory /var/www/verdure

            echo "🛠 Ensuring correct permissions..."
            sudo chown -R $USER:$USER /var/www/verdure
            sudo chmod -R 755 /var/www/verdure

            echo "✅ Directory permissions fixed and Git safe directory set."
